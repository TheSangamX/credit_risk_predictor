# Deploys hf-space/ (a static page that runs the exported model in the browser) to a Hugging Face
# Space, creating it the first time. Static Spaces are free; Gradio ones need a PRO plan.
# Needs one repository secret: HF_TOKEN, a Hugging Face access token with write permission.
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    paths: ["hf-space/**", ".github/workflows/hf-space.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Stage the Space
        run: |
          mkdir -p space
          cp hf-space/* space/
          ls -la space
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: credit-risk-predictor
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::Add HF_TOKEN as a repository secret to deploy the Space."
            exit 0
          fi
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          repo = f"{user}/{os.environ['SPACE_NAME']}"
          api.create_repo(repo, repo_type="space", space_sdk="static", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=repo, repo_type="space", commit_message="Deploy from GitHub")
          print(f"Deployed: https://huggingface.co/spaces/{repo}")
          host = repo.lower().replace("/", "-").replace("_", "-")
          open(os.environ["GITHUB_ENV"], "a").write(f"SPACE_URL=https://{host}.static.hf.space\n")
          PY
      - name: Check the live page
        if: env.SPACE_URL != ''
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sSf "$SPACE_URL" | grep -q "Credit Risk Predictor" && curl -sSf "$SPACE_URL/model.json" | head -c 50 | grep -q threshold; then
              echo "Live at $SPACE_URL"; exit 0
            fi
            sleep 20
          done
          echo "::error::The Space didn't serve the page at $SPACE_URL"; exit 1
